spring.application.name=shortenUrl

# Server port (Railway provides PORT env var)
server.port=${PORT:8081}

# App
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.short-code.length=7

# DB - Railway provides DATABASE_URL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/url_shortener?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:url_shortener}
spring.datasource.password=${DB_PASSWORD:url_shortener}
spring.datasource.hikari.connection-timeout=20000
spring.jvm.additional-args=-Duser.timezone=UTC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=false

# Redis - Railway provides REDIS_URL
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
