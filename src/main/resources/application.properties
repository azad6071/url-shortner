spring.application.name=shortenUrl

server.port=8081

# App
app.base-url=http://localhost:8081
app.short-code.length=7

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/url_shortener?serverTimezone=Asia/Kolkata

spring.datasource.username=url_shortener
spring.datasource.password=url_shortener
spring.datasource.hikari.connection-timeout=20000
spring.jvm.additional-args=-Duser.timezone=UTC

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
