services:
  postgres:
    image: postgres:15
    container_name: url_shortener_postgres
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - url_shortener_pgdata:/var/lib/postgresql/data

volumes:
  url_shortener_pgdata:
